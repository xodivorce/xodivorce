name: refresh-stats

# GitHub Actions runs this workflow once every day at 05:17 UTC.
# You can also run it manually from the Actions tab using workflow_dispatch.

# REQUIRED SETUP:
# 1. Create a GitHub Personal Access Token (PAT).
# 2. Go to:
#    GitHub → Settings → Developer settings → Personal access tokens → Tokens (classic).
# 3. Click Generate new token (classic).
# 4. Give the token a name and choose an expiration date.
# 5. Select the "repo" and "read:user" scopes.
# 6. Click "Generate token" and copy the token.
# 7. Add it to this repository:
#    Repository → Settings → Secrets and variables → Actions → New repository secret
# 8. Set the secret name to exactly:
#    GH_STATS_TOKEN
# 9. Paste the generated token as the secret value and save it.

# NEVER put the actual token directly in this YAML file.

# The token is then passed securely to generate_stats.py through
# the GITHUB_TOKEN environment variable below.

# Deliberately no `push` trigger: this job commits stats.svg, and a push
# trigger would make it re-run on its own commit.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Draw the stat graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
          OUT_DIR: assets/images
        run: python3 scripts/generate_stats.py

      - name: Commit whatever changed
        run: |
          FILES="assets/images/stats.svg assets/images/streak.svg assets/images/langs.svg assets/images/year.svg assets/images/hd-*.svg"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh profile graphics"
          git push
